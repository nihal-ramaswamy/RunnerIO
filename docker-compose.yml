services:
  go_runner:
    container_name: go_runner
    image: golang
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - go_db
      - mongo_express
      - runner_redis
  go_db:
    container_name: go_db
    image: postgres:16
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/go_runner.sql
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    env_file:
      - ./.env
    volumes:
      - mongodb_data:/data/db
  mongo_express:
    image: mongo-express:latest
    container_name: mongo-express
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - ./.env
    depends_on:
      - mongodb
  runner_redis:
    container_name: runner_redis
    image: redis:alpine
    ports:
      - "6379:6379"
volumes:
  pgdata: {}
  mongodb_data:
