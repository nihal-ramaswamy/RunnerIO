services:
  go_runner:
    container_name: go_runner
    image: golang
    build: .
    ports:
      - "8080:8080"
    depends_on:
      - go_db
      - cache_db
      - mongo_db
      - mongo_express
  go_db:
    container_name: go_db
    image: postgres:16
    env_file:
      - ./.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/go_runner.sql
  cache_db:
    container_name: cache_db
    image: redis:alpine
    env_file:
      - ./.env
    ports:
      - '6379:6379'
  mongo_db:
    image: 'mongo'
    env_file:
      - ./.env
    ports:
      - "27017:27017"
  mongo_express:
    image: mongo-express
    restart: always
    ports:
      - "8081:8081"
    env_file:
      - ./.env
volumes:  
  pgdata: {}
